name: 🐍 snake

on:
  schedule:
    - cron: "0 15 * * *" # 00:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#BFDBFE,#60A5FA,#2563EB,#1E3A8A
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#0C3A4A,#0E7490,#06B6D4,#67E8F9

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
