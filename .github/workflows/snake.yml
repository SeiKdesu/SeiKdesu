name: 🐍 pastel snake

on:
  schedule:
    - cron: "0 15 * * *" # 00:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#9B8CF0&color_dots=#EEF1FA,#D6E4FF,#AFC8FF,#8AA6F5,#5F7FE0
            dist/snake-dark.svg?palette=github-dark&color_snake=#8FE3C6&color_dots=#1E2433,#2E3F66,#40589A,#5B7BD0,#8FB0FF

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
