<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-labelledby="title">
  <title id="title">Thanks for visiting — see you in the next commit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#F0F9FF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1000" height="180" fill="url(#fade)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32,0 H0 V32" fill="none" stroke="#1A2540" stroke-width="1"/>
    </pattern>
    <filter id="textGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.83  0 0 0 0 0.93  0 0 0 0.4 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1000" height="180" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .display { font-family: 'Avenir Next', 'Futura', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sweep { animation: sweep 4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1000px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="180" fill="url(#bg)"/>
    <ellipse cx="500" cy="90" rx="420" ry="160" fill="url(#glow)"/>
    <rect width="1000" height="180" fill="url(#grid)" mask="url(#gridMask)"/>

    <text class="mono" x="500" y="52" font-size="13" fill="#64748B" text-anchor="middle" textLength="260" lengthAdjust="spacing">$ git commit -m "thanks for visiting"</text>
    <text class="display" x="500" y="108" font-size="40" font-weight="800" fill="url(#name)" text-anchor="middle" letter-spacing="6" filter="url(#textGlow)">SEE YOU IN THE NEXT COMMIT</text>
    <text class="mono" x="500" y="142" font-size="11" fill="#475A82" text-anchor="middle" letter-spacing="3">KEITO · TOKYO · AI × APPS</text>
    <rect class="cursor" x="636" y="41" width="7" height="14" fill="#22D3EE"/>

    <rect x="0" y="178" width="1000" height="2" fill="#1E293B"/>
    <rect class="sweep" x="0" y="178" width="200" height="2" fill="url(#rule)"/>

    <g fill="none" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5">
      <path d="M16,40 V16 H40"/>
      <path d="M960,16 H984 V40"/>
      <path d="M16,140 V164 H40"/>
      <path d="M984,140 V164 H960"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="178.5" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
