<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="title">
  <title id="title">Thanks for visiting! See you again ♡</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFF2FF"/>
      <stop offset="0.5" stop-color="#F2E9FF"/>
      <stop offset="1" stop-color="#FFE6F0"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#9B7BEA"/>
      <stop offset="1" stop-color="#EC6A9C"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="#FFFFFF" opacity="0.7"/>
    </pattern>
    <clipPath id="card">
      <rect width="1000" height="220" rx="30"/>
    </clipPath>
    <path id="sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z"/>
    <path id="heart" d="M0,6 C-8,0 -12,-6 -7,-10.5 C-3.5,-13.5 0,-10.5 0,-8 C0,-10.5 3.5,-13.5 7,-10.5 C12,-6 8,0 0,6Z"/>
  </defs>
  <style>
    text { font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif; }
    .w1 { animation: slide 9s linear infinite; }
    .w2 { animation: slide 6s linear infinite reverse; }
    .w3 { animation: slide 12s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-250px); } }
    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 1.05); } }
    .z { opacity: 0; animation: zz 3.6s ease-out infinite; }
    .z.z2 { animation-delay: 1.2s; } .z.z3 { animation-delay: 2.4s; }
    @keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(26px, -46px); } }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .tw.d1 { animation-delay: -0.8s; } .tw.d2 { animation-delay: -1.6s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.2); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .z { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <rect width="1000" height="220" fill="url(#dots)"/>

    <g fill="#FFFFFF">
      <g transform="translate(90 50) scale(1)"><use href="#sparkle" class="tw"/></g>
      <g transform="translate(250 34) scale(0.6)"><use href="#sparkle" class="tw d2"/></g>
    </g>
    <g fill="#C4B5FD"><g transform="translate(760 40) scale(0.7)"><use href="#sparkle" class="tw d1"/></g></g>
    <g fill="#F9A8D4"><g transform="translate(180 96) scale(0.65)"><use href="#sparkle" class="tw d2"/></g></g>

    <text x="500" y="70" font-size="36" font-weight="800" text-anchor="middle" fill="url(#name)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Thanks for visiting!</text>
    <text x="500" y="106" font-size="17" font-weight="700" text-anchor="middle" fill="#7D6BB0">またきてね · Have a lovely day</text>
    <g transform="translate(500 132) scale(1.1)"><use href="#heart" class="beat" fill="#FF8FB1"/></g>

    <!-- back waves -->
    <path class="w3" fill="#D9C8FF" opacity="0.55" d="M0,170 Q62.5,150 125,170 T250,170 T375,170 T500,170 T625,170 T750,170 T875,170 T1000,170 T1125,170 T1250,170 V220 H0 Z"/>
    <path class="w2" fill="#BDE7FF" opacity="0.6" d="M0,180 Q62.5,196 125,180 T250,180 T375,180 T500,180 T625,180 T750,180 T875,180 T1000,180 T1125,180 T1250,180 V220 H0 Z"/>

    <!-- sleeping cat -->
    <g transform="translate(860 0)" stroke="#6B5B95" stroke-linejoin="round" stroke-linecap="round">
      <g class="breathe">
        <path d="M-50,150 L-44,104 L-14,128 Z" fill="#FFFDFB" stroke-width="3"/>
        <path d="M-42,142 L-39,116 L-24,129 Z" fill="#FFB8D2" stroke="none"/>
        <path d="M50,150 L44,104 L14,128 Z" fill="#FFFDFB" stroke-width="3"/>
        <path d="M42,142 L39,116 L24,129 Z" fill="#FFB8D2" stroke="none"/>
        <ellipse cx="0" cy="172" rx="62" ry="52" fill="#FFFDFB" stroke-width="3"/>
        <g stroke-width="2">
          <path d="M39,121 L22,111 L24,134 Z" fill="#FF8FB1"/>
          <path d="M39,121 L56,111 L54,134 Z" fill="#FF8FB1"/>
          <circle cx="39" cy="122" r="5" fill="#FFB8D2"/>
        </g>
        <path d="M-30,166 Q-22,174 -14,166" fill="none" stroke-width="2.5"/>
        <path d="M14,166 Q22,174 30,166" fill="none" stroke-width="2.5"/>
        <ellipse cx="-38" cy="182" rx="10" ry="5.5" fill="#FF9EBB" opacity="0.6" stroke="none"/>
        <ellipse cx="38" cy="182" rx="10" ry="5.5" fill="#FF9EBB" opacity="0.6" stroke="none"/>
        <path d="M-4,178 L4,178 L0,183 Z" fill="#FF8FB1" stroke-width="1.5"/>
      </g>
    </g>
    <g font-size="18" font-weight="800" fill="#9B7BEA">
      <text class="z" x="934" y="112">z</text>
      <text class="z z2" x="934" y="112" font-size="22">z</text>
      <text class="z z3" x="934" y="112" font-size="15">z</text>
    </g>

    <!-- front wave -->
    <path class="w1" fill="#FFC6DA" opacity="0.85" d="M0,196 Q62.5,182 125,196 T250,196 T375,196 T500,196 T625,196 T750,196 T875,196 T1000,196 T1125,196 T1250,196 V220 H0 Z"/>
  </g>

  <rect x="1.5" y="1.5" width="997" height="217" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>
</svg>
