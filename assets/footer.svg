<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="title">
  <title id="title">Thanks for visiting! See you again</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2F7EF"/>
      <stop offset="0.5" stop-color="#EEEAFF"/>
      <stop offset="1" stop-color="#E4F0FF"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#9B7BEA"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="#FFFFFF" opacity="0.7"/>
    </pattern>
    <clipPath id="card">
      <rect width="1000" height="220" rx="30"/>
    </clipPath>
    <mask id="crescent">
      <rect x="-40" y="-40" width="80" height="80" fill="#FFFFFF"/>
      <circle cx="14" cy="-10" r="28" fill="#000000"/>
    </mask>
    <path id="sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z"/>
  </defs>
  <style>
    text { font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif; }
    .w1 { animation: slide 9s linear infinite; }
    .w2 { animation: slide 6s linear infinite reverse; }
    .w3 { animation: slide 12s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-250px); } }
    .rock { animation: rock 5s ease-in-out infinite; }
    @keyframes rock { 0%, 100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-6px); } }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .tw.d1 { animation-delay: -0.8s; } .tw.d2 { animation-delay: -1.6s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <rect width="1000" height="220" fill="url(#dots)"/>

    <g fill="#FFFFFF">
      <g transform="translate(90 50)"><use href="#sparkle" class="tw"/></g>
      <g transform="translate(250 34) scale(0.6)"><use href="#sparkle" class="tw d2"/></g>
      <g transform="translate(930 56) scale(0.7)"><use href="#sparkle" class="tw d2"/></g>
    </g>
    <g fill="#C4B5FD"><g transform="translate(760 40) scale(0.7)"><use href="#sparkle" class="tw d1"/></g></g>
    <g fill="#FFD966">
      <g transform="translate(180 96) scale(0.65)"><use href="#sparkle" class="tw d2"/></g>
      <g transform="translate(905 128) scale(0.6)"><use href="#sparkle" class="tw"/></g>
    </g>

    <text x="500" y="70" font-size="36" font-weight="800" text-anchor="middle" fill="url(#name)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" paint-order="stroke">Thanks for visiting!</text>
    <text x="500" y="106" font-size="17" font-weight="700" text-anchor="middle" fill="#5F6AA0">またきてね · Have a lovely day</text>
    <g transform="translate(500 134) scale(1.2)"><use href="#sparkle" class="spin" fill="#B9A8F5"/></g>

    <!-- crescent moon -->
    <g transform="translate(848 112)">
      <g class="rock">
        <circle r="34" fill="#FFE38A" mask="url(#crescent)"/>
        <circle cx="-16" cy="8" r="4" fill="#F2CF5B"/>
        <circle cx="-8" cy="22" r="2.6" fill="#F2CF5B"/>
      </g>
    </g>

    <!-- waves -->
    <path class="w3" fill="#D9CFFF" opacity="0.6" d="M0,170 Q62.5,150 125,170 T250,170 T375,170 T500,170 T625,170 T750,170 T875,170 T1000,170 T1125,170 T1250,170 V220 H0 Z"/>
    <path class="w2" fill="#C3F0DF" opacity="0.7" d="M0,180 Q62.5,196 125,180 T250,180 T375,180 T500,180 T625,180 T750,180 T875,180 T1000,180 T1125,180 T1250,180 V220 H0 Z"/>
    <path class="w1" fill="#BFD9FF" opacity="0.85" d="M0,196 Q62.5,182 125,196 T250,196 T375,196 T500,196 T625,196 T750,196 T875,196 T1000,196 T1125,196 T1250,196 V220 H0 Z"/>
  </g>

  <rect x="1.5" y="1.5" width="997" height="217" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>
</svg>
