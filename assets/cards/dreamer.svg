<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" role="img" aria-labelledby="title">
  <title id="title">Reward-Aware Dreamer V3 — World Model × Reinforcement Learning</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5FF"/>
      <stop offset="1" stop-color="#E8E2FF"/>
    </linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="496" height="196" rx="24"/></clipPath>
    <path id="sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z"/>
  </defs>
  <style>
    text { font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif; }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    .tw.d1 { animation-delay: -1.3s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect x="2" y="2" width="496" height="196" fill="url(#bg)"/>
    <circle cx="470" cy="190" r="74" fill="#D9CFFF" opacity="0.45"/>
    <circle cx="420" cy="214" r="40" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <rect x="2" y="2" width="496" height="196" rx="24" fill="none" stroke="#D2C8FF" stroke-width="2.5"/>

  <g transform="translate(444 132) scale(0.8)"><use href="#sparkle" class="tw" fill="#9B8CF0"/></g>
  <g transform="translate(470 108) scale(0.5)"><use href="#sparkle" class="tw d1" fill="#FFFFFF"/></g>

  <circle cx="58" cy="58" r="30" fill="#FFFFFF" stroke="#D2C8FF" stroke-width="2.5"/>
  <text x="58" y="68" font-size="28" text-anchor="middle">🌙</text>

  <rect x="382" y="22" width="94" height="26" rx="13" fill="#E3DDFF"/>
  <text x="429" y="40" font-size="12.5" font-weight="700" fill="#5F4FB0" text-anchor="middle">JSAI 2026</text>

  <text x="102" y="68" font-size="21" font-weight="800" fill="#33395E">Reward-Aware Dreamer V3</text>
  <text x="102" y="90" font-size="13" font-weight="700" fill="#5F4FB0">World Model × Reinforcement Learning</text>

    <text x="34" y="128" font-size="15" fill="#56608A">報酬に連動して変化する視覚領域を強調した</text>
    <text x="34" y="152" font-size="15" fill="#56608A">重み付き再構成 loss による表現学習</text>

  <circle cx="40" cy="178" r="6" fill="#3572A5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="54" y="183" font-size="13" font-weight="700" fill="#4A5280">Python</text>
  <text x="470" y="183" font-size="13" font-weight="700" fill="#5F4FB0" text-anchor="end">view repo →</text>
</svg>
