<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 216" width="500" height="216" role="img" aria-labelledby="title">
  <title id="title">Reward-Aware Dreamer V3 — world model × reinforcement learning</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24,0 H0 V24" fill="none" stroke="#162036" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="500" height="216" fill="url(#gridFade)"/></mask>
    <clipPath id="card"><rect x="0" y="0" width="500" height="216" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .display { font-family: 'Avenir Next', 'Futura', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; }
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-120px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(520px); opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sweep { opacity: 0; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="500" height="216" fill="url(#bg)"/>
    <rect width="500" height="216" fill="url(#glow)"/>
    <rect width="500" height="216" fill="url(#grid)" mask="url(#gridMask)"/>
    <text class="display" x="482" y="204" font-size="118" font-weight="800" text-anchor="end" fill="none" stroke="#1B2740" stroke-width="1.5">02</text>
    <rect x="0" y="0" width="500" height="2" fill="#1E293B"/>
    <rect class="sweep" x="0" y="0" width="100" height="2" fill="#A78BFA"/>
  </g>
  <rect x="0.75" y="0.75" width="498.5" height="214.5" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="30" y="0" width="56" height="3" fill="#A78BFA"/>

  <text x="30" y="44" font-size="12" font-weight="700" fill="#A78BFA" letter-spacing="2">02</text>
  <text x="56" y="44" font-size="12" fill="#475569" letter-spacing="2">/ DREAMER</text>
  <rect x="381" y="27" width="89" height="24" rx="4" fill="none" stroke="#A78BFA" stroke-opacity="0.55"/>
  <text x="425.5" y="43" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle" letter-spacing="1">JSAI 2026</text>

  <text class="display" x="30" y="88" font-size="25" font-weight="700" fill="#F1F5F9">Reward-Aware Dreamer V3</text>
  <text x="30" y="112" font-size="12.5" fill="#A78BFA">// world model × reinforcement learning</text>

  <text x="30" y="146" font-size="14" fill="#94A3B8" style="font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif">報酬に連動して変化する視覚領域を強調した</text>
  <text x="30" y="168" font-size="14" fill="#94A3B8" style="font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif">重み付き再構成 loss による表現学習</text>

  <line x1="30" y1="182" x2="470" y2="182" stroke="#1E293B"/>
  <circle cx="35" cy="198" r="5" fill="#3572A5"/>
  <text x="48" y="202" font-size="12" fill="#94A3B8">Python</text>
  <text x="470" y="202" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="end">view repo →</text>
</svg>
