<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" role="img" aria-labelledby="title">
  <title id="title">News Podcaster — Flutter × Flask × Gemini API</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FCF7"/>
      <stop offset="1" stop-color="#DAF4E9"/>
    </linearGradient>
    <clipPath id="card"><rect x="2" y="2" width="496" height="196" rx="24"/></clipPath>
    <path id="sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z"/>
  </defs>
  <style>
    text { font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif; }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    .tw.d1 { animation-delay: -1.3s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect x="2" y="2" width="496" height="196" fill="url(#bg)"/>
    <circle cx="470" cy="190" r="74" fill="#C2EEDC" opacity="0.45"/>
    <circle cx="420" cy="214" r="40" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <rect x="2" y="2" width="496" height="196" rx="24" fill="none" stroke="#B5E8D3" stroke-width="2.5"/>

  <g transform="translate(444 132) scale(0.8)"><use href="#sparkle" class="tw" fill="#3FAF8A"/></g>
  <g transform="translate(470 108) scale(0.5)"><use href="#sparkle" class="tw d1" fill="#FFFFFF"/></g>

  <circle cx="58" cy="58" r="30" fill="#FFFFFF" stroke="#B5E8D3" stroke-width="2.5"/>
  <text x="58" y="68" font-size="28" text-anchor="middle">🎧</text>

  <rect x="382" y="22" width="94" height="26" rx="13" fill="#CDF1E3"/>
  <text x="429" y="40" font-size="12.5" font-weight="700" fill="#2E8A6B" text-anchor="middle">Hackathon</text>

  <text x="102" y="68" font-size="21" font-weight="800" fill="#4A3B6B">News Podcaster</text>
  <text x="102" y="90" font-size="13" font-weight="700" fill="#2E8A6B">Flutter × Flask × Gemini API</text>

    <text x="34" y="128" font-size="15" fill="#5E5480">Gemini がニュースを年代別にやさしく要約して</text>
    <text x="34" y="152" font-size="15" fill="#5E5480">音声で届けるポッドキャストアプリ（5人チーム）</text>

  <circle cx="40" cy="178" r="6" fill="#00B4AB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="54" y="183" font-size="13" font-weight="700" fill="#6B5B95">Dart</text>
  <text x="470" y="183" font-size="13" font-weight="700" fill="#2E8A6B" text-anchor="end">view repo ♡</text>
</svg>
