<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="title desc">
  <title id="title">KEITO — AI Researcher × App Developer</title>
  <desc id="desc">LLM × Knowledge Graph, World Models, Flutter. A light pulse travels a multi-hop path across a knowledge graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#F0F9FF"/>
      <stop offset="0.45" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22D3EE"/>
      <stop offset="0.7" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.6" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1000" height="320" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32,0 H0 V32" fill="none" stroke="#1A2540" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.83  0 0 0 0 0.93  0 0 0 0.45 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card">
      <rect width="1000" height="320" rx="18"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .display { font-family: 'Avenir Next', 'Futura', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; }

    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-10px); } to { transform: translateY(330px); } }

    .radar { transform-box: fill-box; transform-origin: center; animation: rotate 40s linear infinite; }
    .radar.r2 { animation-duration: 60s; animation-direction: reverse; }
    @keyframes rotate { to { transform: rotate(360deg); } }

    .packet { stroke-dasharray: 34 1000; animation: travel 3.2s cubic-bezier(.55, 0, .45, 1) infinite; }
    @keyframes travel { from { stroke-dashoffset: 34; } to { stroke-dashoffset: -430; } }

    .ping { transform-box: fill-box; transform-origin: center; animation: ping 3.2s ease-out infinite; }
    .ping.late { animation-delay: 1.6s; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 70%, 100% { transform: scale(3); opacity: 0; } }

    .flick { animation: flick 2.8s ease-in-out infinite; }
    .flick.f2 { animation-delay: -0.9s; } .flick.f3 { animation-delay: -1.8s; }
    @keyframes flick { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .in { opacity: 0; animation: in 0.8s ease-out forwards; }
    .in.i2 { animation-delay: 0.12s; } .in.i3 { animation-delay: 0.24s; } .in.i4 { animation-delay: 0.36s; } .in.i5 { animation-delay: 0.48s; }
    @keyframes in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <circle cx="140" cy="40" r="260" fill="url(#glowBlue)"/>
    <circle cx="790" cy="170" r="260" fill="url(#glowViolet)"/>
    <rect width="1000" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect class="scan" x="0" y="0" width="1000" height="2" fill="url(#scan)"/>

    <!-- radar rings -->
    <g fill="none" stroke="#22304D" stroke-width="1">
      <circle class="radar" cx="790" cy="170" r="62" stroke-dasharray="2 6"/>
      <circle class="radar r2" cx="790" cy="170" r="118" stroke-dasharray="14 10"/>
      <circle class="radar" cx="790" cy="170" r="172" stroke-dasharray="1 9"/>
    </g>

    <!-- knowledge graph -->
    <g stroke="#26355A" stroke-width="1.2">
      <line x1="610" y1="200" x2="705" y2="250"/>
      <line x1="610" y1="200" x2="642" y2="286"/>
      <line x1="642" y1="286" x2="705" y2="250"/>
      <line x1="672" y1="122" x2="700" y2="52"/>
      <line x1="700" y1="52" x2="760" y2="84"/>
      <line x1="672" y1="122" x2="760" y2="84"/>
      <line x1="672" y1="122" x2="705" y2="250"/>
      <line x1="760" y1="84" x2="790" y2="180"/>
      <line x1="705" y1="250" x2="790" y2="180"/>
      <line x1="705" y1="250" x2="858" y2="262"/>
      <line x1="790" y1="180" x2="858" y2="262"/>
      <line x1="858" y1="262" x2="935" y2="196"/>
      <line x1="760" y1="84" x2="868" y2="120"/>
      <line x1="868" y1="120" x2="940" y2="86"/>
      <line x1="940" y1="86" x2="935" y2="196"/>
    </g>
    <g fill="#111A2E" stroke="#3A4A70" stroke-width="1.5">
      <circle cx="705" cy="250" r="5"/>
      <circle cx="642" cy="286" r="4"/>
      <circle cx="700" cy="52" r="4"/>
      <circle cx="760" cy="84" r="5"/>
      <circle cx="858" cy="262" r="5"/>
      <circle cx="940" cy="86" r="4"/>
    </g>
    <g fill="#818CF8">
      <circle class="flick" cx="700" cy="52" r="2"/>
      <circle class="flick f2" cx="858" cy="262" r="2.2"/>
      <circle class="flick f3" cx="642" cy="286" r="2"/>
    </g>

    <!-- multi-hop route: query -> answer -->
    <path d="M610,200 L672,122 L790,180 L868,120 L935,196" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
    <path class="packet" d="M610,200 L672,122 L790,180 L868,120 L935,196" fill="none" stroke="#E0FAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g fill="#0B1222" stroke="#22D3EE" stroke-width="2">
      <circle cx="672" cy="122" r="5.5"/>
      <circle cx="790" cy="180" r="6.5"/>
      <circle cx="868" cy="120" r="5.5"/>
    </g>
    <circle class="ping" cx="610" cy="200" r="8" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <circle class="ping late" cx="935" cy="196" r="8" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="610" cy="200" r="8" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="935" cy="196" r="8" fill="#A78BFA" filter="url(#glow)"/>
    <g class="mono" font-size="10" fill="#7C8DB5" text-anchor="middle" letter-spacing="1">
      <text x="610" y="226">QUERY</text>
      <text x="935" y="222">ANSWER</text>
    </g>
    <text class="mono" x="952" y="300" font-size="10" fill="#475A82" text-anchor="end" letter-spacing="1">residual-guided retrieval · 4 hops</text>

    <!-- status -->
    <circle class="cursor" cx="848" cy="42" r="3.5" fill="#34D399" filter="url(#glow)"/>
    <text class="mono" x="860" y="46" font-size="11" fill="#34D399" letter-spacing="2">RESEARCHING</text>

    <!-- identity -->
    <text class="mono in" x="72" y="64" font-size="13" fill="#22D3EE" letter-spacing="3">AI RESEARCHER × APP DEVELOPER</text>
    <text class="display in i2" x="66" y="150" font-size="94" font-weight="800" letter-spacing="8" fill="url(#name)" filter="url(#textGlow)">KEITO</text>
    <g class="in i3">
      <text class="mono" x="72" y="188" font-size="16" fill="#CBD5E1" textLength="365" lengthAdjust="spacing">&gt; LLM × Knowledge Graph · World Models</text>
      <rect class="cursor" x="442" y="174" width="9" height="18" fill="#22D3EE"/>
    </g>

    <g class="mono" font-size="12.5">
      <g class="in i4">
        <rect x="72" y="219" width="6" height="6" fill="#22D3EE"/>
        <text x="88" y="226" fill="#64748B" letter-spacing="2">LOCATION</text>
        <text x="190" y="226" fill="#E2E8F0">Tokyo, Japan</text>
        <rect x="72" y="243" width="6" height="6" fill="#60A5FA"/>
        <text x="88" y="250" fill="#64748B" letter-spacing="2">FOCUS</text>
        <text x="190" y="250" fill="#E2E8F0">Multi-hop KGQA · RAG · World Models</text>
      </g>
      <g class="in i5">
        <rect x="72" y="267" width="6" height="6" fill="#A78BFA"/>
        <text x="88" y="274" fill="#64748B" letter-spacing="2">PAPERS</text>
        <text x="190" y="274" fill="#E2E8F0">AACL-IJCNLP 2026 · JSAI 2026</text>
      </g>
    </g>

    <!-- HUD corners -->
    <g fill="none" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5">
      <path d="M16,42 V16 H42"/>
      <path d="M958,16 H984 V42"/>
      <path d="M16,278 V304 H42"/>
      <path d="M984,278 V304 H958"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="318.5" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="120" y="0" width="520" height="1.5" fill="url(#topline)"/>
</svg>
