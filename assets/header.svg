<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Keito</title>
  <desc id="desc">AI researcher and app developer from Tokyo. A pastel planet with a ring floats among clouds and stars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4F0FF"/>
      <stop offset="0.55" stop-color="#EEEAFF"/>
      <stop offset="1" stop-color="#E2F7EF"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="540" y2="0">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#9B7BEA"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="-130" y1="0" x2="130" y2="0">
      <stop offset="0" stop-color="#8FE3C6"/>
      <stop offset="0.5" stop-color="#9CC8FF"/>
      <stop offset="1" stop-color="#C2B5FF"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F6F4FF"/>
      <stop offset="0.5" stop-color="#C9BEFF"/>
      <stop offset="1" stop-color="#93B0F7"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="#FFFFFF" opacity="0.7"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="card">
      <rect width="1000" height="320" rx="30"/>
    </clipPath>
    <clipPath id="planetClip">
      <circle r="80"/>
    </clipPath>
    <path id="sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z"/>
    <g id="cloud" fill="#FFFFFF">
      <circle cx="-22" cy="0" r="16"/>
      <circle cx="0" cy="-12" r="22"/>
      <circle cx="24" cy="-2" r="16"/>
      <rect x="-38" y="-2" width="78" height="18" rx="9"/>
    </g>
  </defs>
  <style>
    text { font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif; }
    .blob { animation: drift 12s ease-in-out infinite; }
    .blob.b2 { animation-duration: 15s; animation-delay: -4s; }
    .blob.b3 { animation-duration: 13s; animation-delay: -8s; }
    .blob.b4 { animation-duration: 17s; animation-delay: -2s; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(36px, -24px); } }

    .edge { stroke-dasharray: 5 7; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
    .node.n2 { animation-delay: -0.6s; } .node.n3 { animation-delay: -1.2s; } .node.n4 { animation-delay: -1.8s; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .tw.d1 { animation-delay: -0.5s; } .tw.d2 { animation-delay: -1s; } .tw.d3 { animation-delay: -1.5s; } .tw.d4 { animation-delay: -2s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.55) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

    .spin { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .fade.f2 { animation-delay: 0.15s; } .fade.f3 { animation-delay: 0.3s; } .fade.f4 { animation-delay: 0.45s; } .fade.f5 { animation-delay: 0.6s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .float { animation: bob 4.2s ease-in-out infinite; }
    .float.slow { animation-duration: 5.6s; animation-delay: -1.4s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .cloud { animation: sway 7s ease-in-out infinite; }
    .cloud.c2 { animation-duration: 9s; animation-delay: -3s; }
    @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <g filter="url(#soft)">
      <circle class="blob" cx="110" cy="50" r="120" fill="#BFD9FF" opacity="0.65"/>
      <circle class="blob b2" cx="500" cy="320" r="140" fill="#D9CFFF" opacity="0.55"/>
      <circle class="blob b3" cx="930" cy="40" r="120" fill="#C9E3FF" opacity="0.65"/>
      <circle class="blob b4" cx="700" cy="310" r="110" fill="#C3F0DF" opacity="0.6"/>
    </g>
    <rect width="1000" height="320" fill="url(#dots)"/>

    <!-- knowledge graph constellation -->
    <g stroke="#A99BEA" stroke-width="1.8" stroke-linecap="round" opacity="0.75" fill="none">
      <line class="edge" x1="530" y1="78" x2="585" y2="38"/>
      <line class="edge" x1="585" y1="38" x2="660" y2="52"/>
      <line class="edge" x1="585" y1="38" x2="620" y2="96"/>
      <line class="edge" x1="530" y1="78" x2="620" y2="96"/>
      <line class="edge" x1="620" y1="96" x2="660" y2="52"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="2.5">
      <circle class="node" cx="530" cy="78" r="6" fill="#9CC8FF"/>
      <circle class="node n2" cx="585" cy="38" r="7" fill="#B9A8F5"/>
      <circle class="node n3" cx="660" cy="52" r="5.5" fill="#8FD8BE"/>
      <circle class="node n4" cx="620" cy="96" r="6.5" fill="#FFD966"/>
    </g>

    <!-- sparkles -->
    <g fill="#FFFFFF">
      <g transform="translate(340 44) scale(1.1)"><use href="#sparkle" class="tw"/></g>
      <g transform="translate(975 140) scale(0.9)"><use href="#sparkle" class="tw d2"/></g>
      <g transform="translate(36 286) scale(0.8)"><use href="#sparkle" class="tw d4"/></g>
    </g>
    <g fill="#FFD966">
      <g transform="translate(700 70) scale(0.8)"><use href="#sparkle" class="tw d1"/></g>
      <g transform="translate(520 270) scale(0.7)"><use href="#sparkle" class="tw d3"/></g>
    </g>
    <g fill="#9CC8FF">
      <g transform="translate(470 30) scale(0.6)"><use href="#sparkle" class="tw d3"/></g>
      <g transform="translate(965 290) scale(0.7)"><use href="#sparkle" class="tw d1"/></g>
    </g>
    <g fill="#C4B5FD">
      <g transform="translate(690 230) scale(0.65)"><use href="#sparkle" class="tw d2"/></g>
    </g>

    <!-- greeting -->
    <g class="fade">
      <rect x="70" y="48" width="252" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.8" stroke="#D5CCFF" stroke-width="2"/>
      <g transform="translate(95 67) scale(0.95)"><use href="#sparkle" class="spin" fill="#9B8CF0"/></g>
      <text x="114" y="73" font-size="16" font-weight="700" fill="#5F7FE0" letter-spacing="1">welcome to my page</text>
    </g>

    <text class="fade f2" x="70" y="158" font-size="62" font-weight="800" fill="url(#name)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Hi, I'm Keito</text>
    <text class="fade f3" x="72" y="200" font-size="21" font-weight="700" fill="#454D7C" letter-spacing="0.5">AI Researcher · App Developer · Tokyo</text>
    <text class="fade f4" x="72" y="234" font-size="16.5" font-weight="500" fill="#67709E">LLM × 知識グラフ / World Model の研究と、Flutter でのアプリづくり</text>

    <g class="fade f5" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="70" y="256" width="78" height="28" rx="14" fill="#D6E8FF"/>
      <text x="109" y="275" fill="#2F6FB8">#KGQA</text>
      <rect x="156" y="256" width="66" height="28" rx="14" fill="#E3DDFF"/>
      <text x="189" y="275" fill="#5F4FB0">#LLM</text>
      <rect x="230" y="256" width="124" height="28" rx="14" fill="#CDF1E3"/>
      <text x="292" y="275" fill="#2E8A6B">#WorldModel</text>
      <rect x="362" y="256" width="94" height="28" rx="14" fill="#FFF0B8"/>
      <text x="409" y="275" fill="#8C6A00">#Flutter</text>
    </g>

    <!-- planet -->
    <g transform="translate(832 166)">
      <g class="float">
        <g transform="rotate(-16)">
          <path d="M-128,0 A128 30 0 0 1 128,0" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round"/>
        </g>
        <circle r="80" fill="url(#planet)"/>
        <g clip-path="url(#planetClip)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
          <path d="M-90,-22 Q0,-42 90,-28" stroke-opacity="0.35" stroke-width="10"/>
          <path d="M-90,24 Q0,6 90,18" stroke-opacity="0.25" stroke-width="14"/>
          <path d="M-90,52 Q0,40 90,50" stroke-opacity="0.2" stroke-width="8"/>
        </g>
        <ellipse cx="-32" cy="-38" rx="22" ry="11" fill="#FFFFFF" opacity="0.6" transform="rotate(-32 -32 -38)"/>
        <g transform="rotate(-16)">
          <path d="M-128,0 A128 30 0 0 0 128,0" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round"/>
          <path d="M-110,10 A118 24 0 0 0 40,26" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- moon -->
    <g transform="translate(944 66)">
      <g class="float slow">
        <circle r="16" fill="#FFE38A" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-5" cy="-4" r="3.5" fill="#F2CF5B"/>
        <circle cx="5" cy="5" r="2.5" fill="#F2CF5B"/>
      </g>
    </g>

    <!-- clouds -->
    <g transform="translate(740 268) scale(1.1)"><use href="#cloud" class="cloud" opacity="0.92"/></g>
    <g transform="translate(948 238) scale(0.8)"><use href="#cloud" class="cloud c2" opacity="0.85"/></g>
  </g>

  <rect x="1.5" y="1.5" width="997" height="317" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>
</svg>
