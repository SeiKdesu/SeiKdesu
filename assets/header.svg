<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Keito</title>
  <desc id="desc">AI researcher and app developer from Tokyo. A white cat with a pink ribbon peeks over a laptop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE6F0"/>
      <stop offset="0.55" stop-color="#F2E9FF"/>
      <stop offset="1" stop-color="#DFF2FF"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="540" y2="0">
      <stop offset="0" stop-color="#EC6A9C"/>
      <stop offset="1" stop-color="#9B7BEA"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.8" fill="#FFFFFF" opacity="0.7"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="card">
      <rect width="1000" height="320" rx="30"/>
    </clipPath>
    <path id="sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z"/>
    <path id="heart" d="M0,6 C-8,0 -12,-6 -7,-10.5 C-3.5,-13.5 0,-10.5 0,-8 C0,-10.5 3.5,-13.5 7,-10.5 C12,-6 8,0 0,6Z"/>
  </defs>
  <style>
    text { font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', 'Yu Gothic UI', 'Meiryo', 'Noto Sans JP', sans-serif; }
    .blob { animation: drift 12s ease-in-out infinite; }
    .blob.b2 { animation-duration: 15s; animation-delay: -4s; }
    .blob.b3 { animation-duration: 13s; animation-delay: -8s; }
    .blob.b4 { animation-duration: 17s; animation-delay: -2s; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(36px, -24px); } }

    .edge { stroke-dasharray: 5 7; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
    .node.n2 { animation-delay: -0.6s; } .node.n3 { animation-delay: -1.2s; } .node.n4 { animation-delay: -1.8s; } .node.n5 { animation-delay: -2.2s; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .tw.d1 { animation-delay: -0.5s; } .tw.d2 { animation-delay: -1s; } .tw.d3 { animation-delay: -1.5s; } .tw.d4 { animation-delay: -2s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.55) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

    .flower { transform-box: fill-box; transform-origin: center; animation: spin 8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .fade.f2 { animation-delay: 0.15s; } .fade.f3 { animation-delay: 0.3s; } .fade.f4 { animation-delay: 0.45s; } .fade.f5 { animation-delay: 0.6s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .cat { animation: bob 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.8s ease-in-out infinite; }
    @keyframes wag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }

    .heart { opacity: 0; animation: rise 5.5s ease-in infinite; }
    .heart.h2 { animation-delay: -1.8s; } .heart.h3 { animation-delay: -3.6s; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(0.7); } 15% { opacity: 0.95; } 100% { opacity: 0; transform: translateY(-110px) scale(1.1); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } .heart { display: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <g filter="url(#soft)">
      <circle class="blob" cx="110" cy="50" r="120" fill="#FFC2D9" opacity="0.6"/>
      <circle class="blob b2" cx="500" cy="320" r="140" fill="#D9C8FF" opacity="0.55"/>
      <circle class="blob b3" cx="930" cy="40" r="120" fill="#BDE7FF" opacity="0.65"/>
      <circle class="blob b4" cx="700" cy="310" r="110" fill="#C8F2E2" opacity="0.6"/>
    </g>
    <rect width="1000" height="320" fill="url(#dots)"/>

    <!-- knowledge graph constellation -->
    <g stroke="#B39DDB" stroke-width="1.8" stroke-linecap="round" opacity="0.75" fill="none">
      <line class="edge" x1="530" y1="78" x2="585" y2="38"/>
      <line class="edge" x1="585" y1="38" x2="660" y2="52"/>
      <line class="edge" x1="585" y1="38" x2="620" y2="96"/>
      <line class="edge" x1="530" y1="78" x2="620" y2="96"/>
      <line class="edge" x1="620" y1="96" x2="660" y2="52"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="2.5">
      <circle class="node" cx="530" cy="78" r="6" fill="#FF9EC4"/>
      <circle class="node n2" cx="585" cy="38" r="7" fill="#B9A2F5"/>
      <circle class="node n3" cx="660" cy="52" r="5.5" fill="#8FD8BE"/>
      <circle class="node n4" cx="620" cy="96" r="6.5" fill="#8CCBF5"/>
    </g>

    <!-- sparkles -->
    <g fill="#FFFFFF">
      <g transform="translate(340 44) scale(1.1)"><use href="#sparkle" class="tw"/></g>
      <g transform="translate(965 128) scale(0.9)"><use href="#sparkle" class="tw d2"/></g>
      <g transform="translate(36 286) scale(0.8)"><use href="#sparkle" class="tw d4"/></g>
    </g>
    <g fill="#F9A8D4">
      <g transform="translate(690 140) scale(0.75)"><use href="#sparkle" class="tw d1"/></g>
      <g transform="translate(520 270) scale(0.7)"><use href="#sparkle" class="tw d3"/></g>
    </g>
    <g fill="#C4B5FD">
      <g transform="translate(470 30) scale(0.6)"><use href="#sparkle" class="tw d3"/></g>
      <g transform="translate(940 250) scale(0.7)"><use href="#sparkle" class="tw d1"/></g>
    </g>

    <!-- greeting -->
    <g class="fade">
      <rect x="70" y="48" width="252" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.8" stroke="#FFC6DA" stroke-width="2"/>
      <g transform="translate(95 67)">
        <g class="flower">
          <circle cx="0" cy="-6" r="4.6" fill="#FF8FB1"/>
          <circle cx="5.7" cy="-1.9" r="4.6" fill="#FF8FB1"/>
          <circle cx="3.5" cy="4.9" r="4.6" fill="#FF8FB1"/>
          <circle cx="-3.5" cy="4.9" r="4.6" fill="#FF8FB1"/>
          <circle cx="-5.7" cy="-1.9" r="4.6" fill="#FF8FB1"/>
          <circle cx="0" cy="0" r="3.4" fill="#FFE08A"/>
        </g>
      </g>
      <text x="114" y="73" font-size="16" font-weight="700" fill="#EC6A9C" letter-spacing="1">welcome to my page</text>
    </g>

    <text class="fade f2" x="70" y="158" font-size="62" font-weight="800" fill="url(#name)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Hi, I'm Keito</text>
    <text class="fade f3" x="72" y="200" font-size="21" font-weight="700" fill="#6B5B95" letter-spacing="0.5">AI Researcher · App Developer · Tokyo</text>
    <text class="fade f4" x="72" y="234" font-size="16.5" font-weight="500" fill="#8574B0">LLM × 知識グラフ / World Model の研究と、Flutter でのアプリづくり</text>

    <g class="fade f5" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="70" y="256" width="78" height="28" rx="14" fill="#FFD3E3"/>
      <text x="109" y="275" fill="#B0477A">#KGQA</text>
      <rect x="156" y="256" width="66" height="28" rx="14" fill="#E3D9FF"/>
      <text x="189" y="275" fill="#6E55A8">#LLM</text>
      <rect x="230" y="256" width="124" height="28" rx="14" fill="#CDF1E3"/>
      <text x="292" y="275" fill="#2E8A6B">#WorldModel</text>
      <rect x="362" y="256" width="94" height="28" rx="14" fill="#D3ECFF"/>
      <text x="409" y="275" fill="#2F7DB8">#Flutter</text>
    </g>

    <!-- floating hearts -->
    <g fill="#FF9EC4">
      <g transform="translate(712 230)"><use href="#heart" class="heart"/></g>
      <g transform="translate(948 200) scale(0.8)"><use href="#heart" class="heart h2"/></g>
      <g transform="translate(735 150) scale(0.65)"><use href="#heart" class="heart h3"/></g>
    </g>

    <!-- cat -->
    <g transform="translate(822 0)">
      <g class="cat" stroke="#6B5B95" stroke-linejoin="round" stroke-linecap="round">
        <g class="tail" fill="none">
          <path d="M70,292 C140,300 150,232 120,214" stroke-width="24"/>
          <path d="M70,292 C140,300 150,232 120,214" stroke="#FFFDFB" stroke-width="16"/>
        </g>
        <ellipse cx="0" cy="288" rx="92" ry="70" fill="#FFFDFB" stroke-width="3.5"/>

        <path d="M-72,152 L-62,86 L-20,122 Z" fill="#FFFDFB" stroke-width="3.5"/>
        <path d="M-60,140 L-55,104 L-34,123 Z" fill="#FFB8D2" stroke="none"/>
        <path d="M72,152 L62,86 L20,122 Z" fill="#FFFDFB" stroke-width="3.5"/>
        <path d="M60,140 L55,104 L34,123 Z" fill="#FFB8D2" stroke="none"/>
        <ellipse cx="0" cy="186" rx="88" ry="72" fill="#FFFDFB" stroke-width="3.5"/>

        <g stroke-width="2.5">
          <path d="M54,116 L30,101 L32,133 Z" fill="#FF8FB1"/>
          <path d="M54,116 L78,101 L76,133 Z" fill="#FF8FB1"/>
          <circle cx="54" cy="117" r="7" fill="#FFB8D2"/>
        </g>

        <g stroke="none">
          <g class="eye">
            <ellipse cx="-30" cy="184" rx="8.5" ry="10.5" fill="#4A3B6B"/>
            <circle cx="-27" cy="180" r="3.2" fill="#FFFFFF"/>
          </g>
          <g class="eye">
            <ellipse cx="30" cy="184" rx="8.5" ry="10.5" fill="#4A3B6B"/>
            <circle cx="33" cy="180" r="3.2" fill="#FFFFFF"/>
          </g>
          <ellipse cx="-54" cy="207" rx="13" ry="7" fill="#FF9EBB" opacity="0.6"/>
          <ellipse cx="54" cy="207" rx="13" ry="7" fill="#FF9EBB" opacity="0.6"/>
        </g>
        <path d="M-6,199 L6,199 L0,206 Z" fill="#FF8FB1" stroke-width="2"/>
        <path d="M-12,210 Q-6,219 0,210 Q6,219 12,210" fill="none" stroke-width="2.5"/>
        <g stroke-width="2" opacity="0.55">
          <line x1="-62" y1="196" x2="-96" y2="189"/>
          <line x1="-62" y1="205" x2="-97" y2="209"/>
          <line x1="62" y1="196" x2="96" y2="189"/>
          <line x1="62" y1="205" x2="97" y2="209"/>
        </g>

        <rect x="-64" y="236" width="128" height="82" rx="12" fill="#E9DDFF" stroke-width="3.5"/>
        <use href="#heart" transform="translate(0 280) scale(1.1)" fill="#FF8FB1" stroke="none"/>
        <ellipse cx="-40" cy="238" rx="17" ry="11" fill="#FFFDFB" stroke-width="3"/>
        <ellipse cx="40" cy="238" rx="17" ry="11" fill="#FFFDFB" stroke-width="3"/>
      </g>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="997" height="317" rx="29" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>
</svg>
