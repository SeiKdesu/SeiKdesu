<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="01 ABOUT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0E1528"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bar"><rect width="1000" height="64" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sweep { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1100px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#bar)">
    <rect width="1000" height="64" fill="url(#bg)"/>
    <rect x="0" y="0" width="5" height="64" fill="#22D3EE"/>
    <rect class="sweep" x="-160" y="62" width="160" height="2" fill="#22D3EE" opacity="0.6"/>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="62.5" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="32" y="40" font-size="18" font-weight="700" fill="#22D3EE" letter-spacing="2">01</text>
  <text x="70" y="40" font-size="18" fill="#334155">/</text>
  <text x="92" y="40" font-size="18" font-weight="700" fill="#F1F5F9" letter-spacing="4" style="font-family: 'Avenir Next', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">ABOUT</text>
  <rect x="241" y="31" width="548" height="1" fill="url(#rule)"/>
  <text x="930" y="37" font-size="13" fill="#64748B" text-anchor="end">$ whoami</text>
  <rect class="blink" x="938" y="25" width="8" height="15" fill="#22D3EE"/>
</svg>
